<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozoles Las Tías</title>
    <meta name="theme-color" content="#d9534f">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-image: url('negocio.jpg'); background-size: cover; background-position: center; background-attachment: fixed; padding-bottom: 100px; }
        header { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('negocio.jpg'); background-size: cover; background-position: center; color: white; padding: 30px 18px; text-align: center; font-size: 1.5rem; font-weight: bold; }
        .container { padding: 20px; max-width: 600px; margin: -20px auto 20px auto; background: rgba(255, 255, 255, 0.95); border-radius: 20px 20px 0 0; }
        .btn-admin { background: #333; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-bottom: 10px; cursor: pointer; font-weight: bold; }
        
        .table-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 5px 0 15px 0; scrollbar-width: none; }
        .table-tabs::-webkit-scrollbar { display: none; }
        .table-tab { padding: 8px 14px; background: #eee; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
        .table-tab.active { background: #d9534f; color: white; }

        .menu-item { background: white; padding: 12px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-img { width: 75px; height: 75px; border-radius: 10px; object-fit: cover; border: 1px solid #eee; flex-shrink: 0; }
        .add-btn { background: #d9534f; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .cart-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .qty-btn { padding: 5px 10px; border: none; background: #eee; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .option-pill { padding: 8px 12px; background:#eee; border-radius:15px; cursor:pointer; font-size:0.8rem; border: 1px solid #ddd; }
        .option-pill.active { background: #d9534f; color: white; border-color: #d9534f; }
        
        .bottom-bar { position: fixed; bottom: 0; width: 100%; background: white; padding: 10px; border-top: 1px solid #ddd; max-width: 600px; left: 50%; transform: translateX(-50%); z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .bottom-btn { background: #d9534f; color: white; border: none; padding: 8px 2px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; cursor: pointer; text-align: center; }
        .bottom-btn.llevar { background: #333; }
    </style>
</head>
<body>

    <header>Pozoles Las Tías 🍲</header>

    <div class="container" id="main-view">
        <button class="btn-admin" onclick="pedirPinYEntrar()">📊 Administrar Ventas y QR</button>
        
        <p style="font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 5px;">Agregando platillos para:</p>
        <div class="table-tabs" id="tableTabsContainer">
            <button class="table-tab active" onclick="setActiveTable('Mesa 1')">Mesa 1</button>
            <button class="table-tab" onclick="setActiveTable('Mesa 2')">Mesa 2</button>
            <button class="table-tab" onclick="setActiveTable('Mesa 3')">Mesa 3</button>
            <button class="table-tab" onclick="setActiveTable('Mesa 4')">Mesa 4</button>
            <button class="table-tab" onclick="setActiveTable('Para llevar')">Para llevar</button>
        </div>

        <div id="menu-list"></div>
    </div>

    <div class="container" id="stats-view" style="display:none;">
        <button class="btn-admin" style="background:#d9534f" onclick="toggleView()">⬅ Volver al Menú</button>
        <h3>📊 Tablero de Ventas y Código QR</h3>
        
        <!-- Sección de Configuración del QR -->
        <div style="background: #f9f9f9; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd;">
            <h4 style="font-size: 0.9rem; margin-bottom: 6px; color: #333;">🖨️ Generador de QR para Mesas:</h4>
            <p style="font-size: 0.75rem; color: #666; margin-bottom: 8px;">Pega aquí el enlace web de tu menú publicado en GitHub:</p>
            <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                <input type="text" id="siteUrlInput" placeholder="https://tu-usuario.github.io/tu-repo/" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.8rem;">
                <button onclick="guardarUrlQR()" style="background: #333; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem;">Guardar</button>
            </div>
            <div id="qrContainer" style="text-align: center; margin-top: 10px; display: none;">
                <img id="qrImage" src="" alt="Código QR del Menú" style="width: 150px; height: 150px; border: 4px solid white; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <p style="font-size: 0.75rem; color: #555; margin-top: 5px;">Escanea para ver el menú y ordenar</p>
            </div>
        </div>

        <div id="orders-history" style="margin-top:15px"></div>
        <button class="btn-admin" style="background:#666; margin-top:20px" onclick="resetStats()">🗑️ Borrar Historial</button>
    </div>

    <!-- Barra Inferior con 5 Botones -->
    <div class="bottom-bar">
        <button class="bottom-btn" onclick="abrirCart('Mesa 1')" id="btn-Mesa 1">M1 (0)</button>
        <button class="bottom-btn" onclick="abrirCart('Mesa 2')" id="btn-Mesa 2">M2 (0)</button>
        <button class="bottom-btn" onclick="abrirCart('Mesa 3')" id="btn-Mesa 3">M3 (0)</button>
        <button class="bottom-btn" onclick="abrirCart('Mesa 4')" id="btn-Mesa 4">M4 (0)</button>
        <button class="bottom-btn llevar" onclick="abrirCart('Para llevar')" id="btn-Para llevar">Llevar (0)</button>
    </div>

    <!-- Modal de Personalización -->
    <div class="modal" id="customModal">
        <div class="modal-content">
            <h3 id="modalItemName"></h3>
            <p id="modalInstruction" style="font-size:0.8rem; color:#666; margin-top:5px;"></p>
            
            <div id="sizeContainer" style="margin-top:10px; display:none;">
                <label style="font-size:0.8rem; font-weight:bold; color:#555;">Tamaño:</label>
                <div id="sizeOptions" style="display:flex; gap:8px; margin-top:5px"></div>
            </div>

            <div id="meatContainer" style="margin-top:10px;">
                <label style="font-size:0.8rem; font-weight:bold; color:#555;">Opciones:</label>
                <div id="meatOptions" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:5px"></div>
            </div>

            <div id="takeoutContainer" style="margin-top:15px; display:none;"><label style="font-weight:bold"><input type="checkbox" id="takeoutCheck"> Para llevar (+$5)</label></div>
            <textarea id="itemNotes" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ccc; border-radius:8px;" placeholder="Observaciones (ej. Sin lechuga)"></textarea>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button style="flex:1; padding:10px; border-radius:8px; border:none; background:#eee" onclick="document.getElementById('customModal').style.display='none'">Cancelar</button>
                <button style="flex:1; padding:10px; border-radius:8px; border:none; background:#d9534f; color:white" onclick="agregarAlCarrito()">Agregar</button>
            </div>
        </div>
    </div>

    <!-- Modal del Carrito / Pedido -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h3 id="cartModalTitle">Pedido</h3>
            <div id="cartItemsList" style="margin: 15px 0;"></div>
            <div style="font-weight:bold; font-size:1.2rem; text-align:right; margin-bottom:20px;">Total: <span id="cartTotal">$0</span></div>
            <button style="width:100%; padding:12px; background:#25d366; color:white; border:none; border-radius:8px; font-weight:bold; margin-bottom:10px" onclick="enviarWhatsApp()">Enviar por WhatsApp 📲</button>
            <button style="width:100%; padding:10px; background:#f44336; color:white; border:none; border-radius:8px;" onclick="limpiarCarritoActual()">🗑️ Limpiar este pedido</button>
            <button style="width:100%; padding:10px; background:none; border:none; color:#666; margin-top:10px" onclick="document.getElementById('cartModal').style.display='none'">Seguir comprando</button>
        </div>
    </div>

    <script>
        // CAMBIA AQUÍ TU PIN SECRETO DE ADMINISTRADOR SI LO DESEAS
        const PIN_ADMIN = "1234";

        const menu = [
            { id: 1, name: "Pozole", category: "Pozoles y Caldos", sizes: [{name: "Chica", price: 80}, {name: "Grande", price: 100}], options: ["Pollo", "Maciza", "Cabeza", "Surtida"], img: "pozole.jpg", hasTakeout: true, isMulti: false },
            { id: 2, name: "Pancita", category: "Pozoles y Caldos", sizes: [{name: "Chica", price: 80}, {name: "Grande", price: 100}], options: [], img: "pancita.jpg", hasTakeout: true, isMulti: false },
            { id: 3, name: "Flautas", category: "Antojitos", price: 75, options: ["Pollo", "Carne"], img: "flautas.jpg", hasTakeout: false, isMulti: false },
            { id: 4, name: "Gordita", category: "Antojitos", price: 35, options: ["Chicharrón", "Pollo", "Carne", "Quesillo"], img: "gordita.jpg", hasTakeout: false, isMulti: true },
            { id: 5, name: "Quesadilla", category: "Antojitos", price: 25, options: ["Pollo", "Carne", "Queso", "Quesillo"], img: "quesadilla.jpg", hasTakeout: false, isMulti: true },
            { id: 6, name: "Pambazo", category: "Antojitos", price: 35, options: ["Sencillo", "Papa", "Pollo", "Carne", "Quesillo"], img: "pambazo.jpg", hasTakeout: false, isMulti: true },
            { id: 7, name: "Tostada", category: "Antojitos", price: 30, options: ["Pollo", "Res", "Pata"], img: "tostada.jpg", hasTakeout: false, isMulti: false },
            { id: 8, name: "Agua de Jamaica", category: "Bebidas", price: 40, options: ["Litro ($40)", "Medio litro ($20)"], img: "jamaica.jpg", hasTakeout: false, isMulti: false },
            { id: 9, name: "Coca-Cola", category: "Bebidas", price: 30, options: [], img: "cocacola.jpg", hasTakeout: false, isMulti: false },
            { id: 10, name: "Jarritos", category: "Bebidas", price: 30, options: ["Piña", "Mandarina", "Limón", "Uva", "Tamarindo", "Tutifruti"], img: "jarritos.jpg", hasTakeout: false, isMulti: false },
            { id: 11, name: "Boing", category: "Bebidas", price: 30, options: ["Mango", "Manzana", "Guayaba"], img: "boing.jpg", hasTakeout: false, isMulti: false },
            { id: 12, name: "Café", category: "Bebidas", price: 20, options: [], img: "cafe.jpg", hasTakeout: false, isMulti: false }
        ];

        let carts = {
            "Mesa 1": {},
            "Mesa 2": {},
            "Mesa 3": {},
            "Mesa 4": {},
            "Para llevar": {}
        };

        let activeTable = "Mesa 1";
        let currentCartLocation = "Mesa 1";
        let selectedSize = null;
        let selectedOptions = []; 
        let currentItem = null;

        function setActiveTable(table) {
            activeTable = table;
            document.querySelectorAll('.table-tab').forEach(tab => {
                tab.classList.toggle('active', tab.innerText.includes(table));
            });
        }

        function abrirModal(id) {
            currentItem = menu.find(m => m.id === id);
            selectedOptions = [];
            document.getElementById('modalItemName').innerText = `${currentItem.name} (${activeTable})`;
            document.getElementById('modalInstruction').innerText = currentItem.isMulti ? "Selecciona hasta 2 opciones" : "";
            document.getElementById('itemNotes').value = "";
            document.getElementById('takeoutCheck').checked = false;
            document.getElementById('takeoutContainer').style.display = currentItem.hasTakeout ? 'block' : 'none';
            
            const sizeContainer = document.getElementById('sizeContainer');
            const sizeOptionsDiv = document.getElementById('sizeOptions');
            if (currentItem.sizes) {
                sizeContainer.style.display = "block";
                selectedSize = currentItem.sizes[1]; 
                sizeOptionsDiv.innerHTML = currentItem.sizes.map(s => `
                    <div class="option-pill ${s.name === selectedSize.name ? 'active' : ''}" onclick="selectSize('${s.name}', ${s.price}, this)">${s.name} ($${s.price})</div>`).join('');
            } else {
                sizeContainer.style.display = "none";
                selectedSize = null;
            }

            renderOptions();
            document.getElementById('customModal').style.display = 'flex';
        }

        function selectSize(name, price, el) {
            selectedSize = { name, price };
            document.querySelectorAll('#sizeOptions .option-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        function renderOptions() {
            const container = document.getElementById('meatOptions');
            const meatContainer = document.getElementById('meatContainer');
            if (currentItem.options.length > 0) {
                meatContainer.style.display = "block";
                container.style.display = "flex";
                container.innerHTML = currentItem.options.map(opt => `
                    <div class="option-pill" onclick="toggleOption('${opt}', this)">${opt}</div>`).join('');
            } else { 
                meatContainer.style.display = "none";
                container.style.display = "none"; 
            }
        }

        function toggleOption(opt, el) {
            if (currentItem.isMulti) {
                if (selectedOptions.includes(opt)) {
                    selectedOptions = selectedOptions.filter(o => o !== opt);
                    el.classList.remove('active');
                } else if (selectedOptions.length < 2) {
                    selectedOptions.push(opt);
                    el.classList.add('active');
                }
            } else {
                selectedOptions = [opt];
                document.querySelectorAll('#meatOptions .option-pill').forEach(p => p.classList.remove('active'));
                el.classList.add('active');
            }
        }

        function agregarAlCarrito() {
            let price = selectedSize ? selectedSize.price : currentItem.price;
            let finalName = currentItem.name;
            if (selectedSize) {
                finalName += ` (${selectedSize.name})`;
            }
            let takeout = document.getElementById('takeoutCheck').checked;
            
            if (currentItem.name === "Agua de Jamaica" && selectedOptions.includes("Medio litro ($20)")) price = 20;
            
            if (currentItem.isMulti) {
                selectedOptions.forEach(opt => {
                    if (currentItem.name === "Pambazo") {
                        if (opt !== "Sencillo") price += 10;
                    } else {
                        price += 5;
                    }
                });
            }

            if (takeout) { price += 5; finalName += " (Llevar)"; }
            
            const notes = document.getElementById('itemNotes').value;
            const key = currentItem.id + (selectedSize ? selectedSize.name : '') + selectedOptions.join(',') + takeout + notes;
            
            if (!carts[activeTable]) carts[activeTable] = {};
            carts[activeTable][key] = { 
                name: finalName, 
                category: currentItem.category,
                price: price, 
                options: selectedOptions, 
                notes: notes, 
                qty: (carts[activeTable][key]?.qty || 0) + 1 
            };

            document.getElementById('customModal').style.display = 'none';
            updateBottomButtons();
        }

        function updateBottomButtons() {
            const tables = ["Mesa 1", "Mesa 2", "Mesa 3", "Mesa 4", "Para llevar"];
            tables.forEach(t => {
                let count = Object.values(carts[t] || {}).reduce((s, i) => s + i.qty, 0);
                let btnId = t === "Para llevar" ? "btn-Para llevar" : `btn-${t}`;
                let label = t === "Para llevar" ? "Llevar" : t.replace("Mesa ", "M");
                document.getElementById(btnId).innerText = `${label} (${count})`;
            });
        }

        function abrirCart(location) {
            currentCartLocation = location;
            document.getElementById('cartModalTitle').innerText = `Pedido de ${location}`;
            let list = document.getElementById('cartItemsList');
            let total = 0;
            let currentCart = carts[location] || {};

            list.innerHTML = Object.keys(currentCart).map(k => {
                total += currentCart[k].price * currentCart[k].qty;
                return `
                <div class="cart-row">
                    <div><b>${currentCart[k].name}</b><br><small>${currentCart[k].options.join(' + ') || ''} ${currentCart[k].notes || ''}</small></div>
                    <div style="display:flex; align-items:center; gap:5px">
                        <button class="qty-btn" onclick="ajustarQty('${location}', '${k}', -1)">-</button>
                        <span>${currentCart[k].qty}</span>
                        <button class="qty-btn" onclick="ajustarQty('${location}', '${k}', 1)">+</button>
                    </div>
                </div>`;
            }).join('') || '<p style="text-align:center; color:#777;">Sin productos en este pedido</p>';

            document.getElementById('cartTotal').innerText = '$' + total;
            document.getElementById('cartModal').style.display = 'flex';
        }

        function ajustarQty(location, key, delta) {
            if (!carts[location][key]) return;
            carts[location][key].qty += delta;
            if(carts[location][key].qty <= 0) delete carts[location][key];
            updateBottomButtons();
            abrirCart(location);
        }

        function limpiarCarritoActual() {
            if(confirm(`¿Limpiar el pedido de ${currentCartLocation}?`)) {
                carts[currentCartLocation] = {};
                updateBottomButtons();
                abrirCart(currentCartLocation);
            }
        }

        function enviarWhatsApp() {
            let currentCart = carts[currentCartLocation] || {};
            if(Object.keys(currentCart).length === 0) return alert("Este pedido está vacío");
            
            let total = 0, msg = `Pedido: ${currentCartLocation}%0A`;
            let itemsArray = [];
            
            for(let k in currentCart) { 
                msg += `• ${currentCart[k].qty}x ${currentCart[k].name} ${currentCart[k].options.length > 0 ? `(${currentCart[k].options.join(' + ')})` : ''} ${currentCart[k].notes ? `[${currentCart[k].notes}]` : ''}%0A`;
                total += currentCart[k].price * currentCart[k].qty;
                itemsArray.push({
                    name: currentCart[k].name,
                    category: currentCart[k].category || "Otros",
                    price: currentCart[k].price,
                    qty: currentCart[k].qty
                });
            }
            msg += `%0ATotal: $${total}`;
            
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push({ 
                loc: currentCartLocation, 
                total: total, 
                items: itemsArray, 
                time: new Date().toLocaleTimeString() 
            });
            localStorage.setItem('orders', JSON.stringify(orders));
            
            carts[currentCartLocation] = {};
            updateBottomButtons();
            document.getElementById('cartModal').style.display = 'none';
            
            window.open(`https://wa.me/5215549354467?text=${msg}`, '_blank');
        }

        function pedirPinYEntrar() {
            let ingreso = prompt("Ingresa el PIN de administrador:");
            if (ingreso === PIN_ADMIN) {
                toggleView();
            } else if (ingreso !== null) {
                alert("PIN incorrecto.");
            }
        }

        function toggleView() {
            const main = document.getElementById('main-view'), stats = document.getElementById('stats-view');
            main.style.display = (main.style.display === 'none') ? 'block' : 'none';
            stats.style.display = (stats.style.display === 'none') ? 'block' : 'none';
            if(stats.style.display === 'block') {
                loadStats();
                cargarQrGuardado();
            }
        }

        function guardarUrlQR() {
            let url = document.getElementById('siteUrlInput').value.trim();
            if(!url) return alert("Por favor ingresa un enlace válido");
            localStorage.setItem('siteUrl', url);
            mostrarQr(url);
        }

        function cargarQrGuardado() {
            let savedUrl = localStorage.getItem('siteUrl');
            if(savedUrl) {
                document.getElementById('siteUrlInput').value = savedUrl;
                mostrarQr(savedUrl);
            }
        }

        function mostrarQr(url) {
            let qrContainer = document.getElementById('qrContainer');
            let qrImage = document.getElementById('qrImage');
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}`;
            qrContainer.style.display = 'block';
        }

        function loadStats() {
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            let totalGeneral = orders.reduce((sum, o) => sum + o.total, 0);
            
            let categoryTotals = {};
            let articleTotals = {};

            orders.forEach(o => {
                if(o.items) {
                    o.items.forEach(item => {
                        let cat = item.category || "Otros";
                        categoryTotals[cat] = (categoryTotals[cat] || 0) + (item.price * item.qty);

                        let artName = item.name;
                        if(!articleTotals[artName]) {
                            articleTotals[artName] = { qty: 0, total: 0 };
                        }
                        articleTotals[artName].qty += item.qty;
                        articleTotals[artName].total += (item.price * item.qty);
                    });
                }
            });

            let categoryHTML = Object.keys(categoryTotals).map(cat => `
                <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.9rem;">
                    <span>📂 ${cat}</span>
                    <b>$${categoryTotals[cat]}</b>
                </div>
            `).join('') || '<p style="color:#777; font-size:0.85rem; text-align:center;">No hay ventas registradas aún.</p>';

            let articleHTML = Object.keys(articleTotals).map(art => `
                <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.85rem;">
                    <span>🍲 ${art} (<b>${articleTotals[art].qty} pzas</b>)</span>
                    <b>$${articleTotals[art].total}</b>
                </div>
            `).join('') || '<p style="color:#777; font-size:0.85rem; text-align:center;">No hay ventas registradas aún.</p>';

            document.getElementById('orders-history').innerHTML = `
                <div style="background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #d9534f;">
                    <span style="font-size:0.85rem; color:#555;">Total General del Día:</span><br>
                    <b style="font-size: 1.3rem; color: #d9534f;">$${totalGeneral}</b>
                </div>
                
                <h4 style="margin-bottom: 8px; font-size: 0.95rem; color: #333;">📋 Ventas por Categoría:</h4>
                <div style="background: white; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px;">
                    ${categoryHTML}
                </div>

                <h4 style="margin-bottom: 8px; font-size: 0.95rem; color: #333;">📦 Ventas por Artículo (Desglose):</h4>
                <div style="background: white; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px;">
                    ${articleHTML}
                </div>

                <h4 style="margin-bottom: 8px; font-size: 0.95rem; color: #333;">🕒 Historial de Pedidos:</h4>
                ` + orders.map(o => `<div style="padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 0.85rem; color:#444;">${o.time} - <b>${o.loc}</b> - $${o.total}</div>`).join('');
        }

        function resetStats() { 
            if(confirm("¿Seguro que deseas borrar el historial de ventas?")) { 
                localStorage.removeItem('orders'); 
                loadStats(); 
            } 
        }

        document.getElementById('menu-list').innerHTML = menu.map(item => `
            <div class="menu-item" onclick="abrirModal(${item.id})">
                <div style="display:flex; align-items:center; gap:10px">
                    <img src="${item.img}" class="menu-img">
                    <div>
                        <h3>${item.name}</h3>
                        <p>${item.sizes ? 'Desde $' + item.sizes[0].price : '$' + item.price + '.00'}</p>
                    </div>
                </div>
                <button class="add-btn">Agregar</button>
            </div>`).join('');

        updateBottomButtons();
    </script>
</body>
</html>
